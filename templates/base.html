<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}战场决策研究{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-base:      #0d1117;
      --bg-surface:   #161b22;
      --bg-elevated:  #1c2128;
      --border:       #30363d;
      --text-primary: #e6edf3;
      --text-muted:   #8b949e;
      --text-faint:   #484f58;
      --accent-blue:  #58a6ff;
      --accent-amber: #fbbf24;
      --accent-red:   #f85149;
      --accent-green: #3fb950;
      --shadow: 0 4px 24px rgba(0,0,0,.55);
    }

    html { font-size: 16px; scroll-behavior: smooth; }

    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.7;
      background-image:
        radial-gradient(ellipse at 15% 50%, rgba(88,166,255,.05) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 15%, rgba(63,185,80,.03) 0%, transparent 45%);
    }

    .page-wrap        { max-width: 800px;  margin: 0 auto; padding: 2.5rem 1.5rem 5rem; }
    .page-wrap--wide  { max-width: 1160px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2rem 2.25rem;
      box-shadow: var(--shadow);
    }
    .card + .card { margin-top: 1.5rem; }

    h1 { font-size: 1.9rem; font-weight: 700; line-height: 1.25; }
    h2 { font-size: 1.3rem; font-weight: 600; line-height: 1.3; }
    h3 { font-size: 1.05rem; font-weight: 600; }
    p  { color: var(--text-primary); }

    .badge {
      display: inline-flex; align-items: center; gap: .35rem;
      padding: .22rem .7rem; border-radius: 999px;
      font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    }
    .badge-blue   { background: rgba(88,166,255,.14);  color: var(--accent-blue);  border: 1px solid rgba(88,166,255,.28); }
    .badge-amber  { background: rgba(251,191,36,.12);  color: var(--accent-amber); border: 1px solid rgba(251,191,36,.30); }
    .badge-red    { background: rgba(248,81,73,.14);   color: var(--accent-red);   border: 1px solid rgba(248,81,73,.30); }
    .badge-green  { background: rgba(63,185,80,.14);   color: var(--accent-green); border: 1px solid rgba(63,185,80,.28); }
    .badge-purple { background: rgba(165,180,252,.12); color: #a5b4fc;             border: 1px solid rgba(165,180,252,.25); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
      padding: .72rem 1.7rem; border-radius: 9px;
      font-family: inherit; font-size: 1rem; font-weight: 500;
      cursor: pointer; border: none; transition: all .18s ease;
      text-decoration: none; white-space: nowrap;
    }
    .btn-primary { background: var(--accent-blue); color: #000; }
    .btn-primary:hover  { background: #79c0ff; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(88,166,255,.38); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: .42; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-danger { background: var(--accent-red); color: #fff; }
    .btn-danger:hover { background: #ff6a60; transform: translateY(-1px); }

    .btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
    .btn-ghost:hover { border-color: var(--text-muted); color: var(--text-primary); }

    .btn-success { background: var(--accent-green); color: #000; }
    .btn-success:hover { background: #56d364; transform: translateY(-1px); }

    .btn-sm { padding: .44rem .9rem; font-size: .875rem; }

    hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }

    input[type="text"], input[type="password"], input[type="number"], select, textarea {
      background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text-primary); font-family: inherit; font-size: 1rem;
      padding: .6rem .9rem; width: 100%; transition: border-color .15s; outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(88,166,255,.15);
    }
    label { display: block; font-size: .9rem; color: var(--text-muted); margin-bottom: .4rem; font-weight: 500; }

    .alert { padding: .9rem 1.1rem; border-radius: 8px; font-size: .9rem; margin-bottom: 1rem; }
    .alert-error   { background: rgba(248,81,73,.1);  border: 1px solid rgba(248,81,73,.28);  color: var(--accent-red); }
    .alert-success { background: rgba(63,185,80,.1);  border: 1px solid rgba(63,185,80,.26);  color: var(--accent-green); }
    .alert-info    { background: rgba(88,166,255,.1); border: 1px solid rgba(88,166,255,.26); color: var(--accent-blue); }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-base); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-1 { gap: .5rem; }  .gap-2 { gap: 1rem; }  .gap-3 { gap: 1.5rem; }
    .mt-1 { margin-top: .5rem; }  .mt-2 { margin-top: 1rem; }
    .mt-3 { margin-top: 1.5rem; } .mt-4 { margin-top: 2rem; }
    .mb-1 { margin-bottom: .5rem; }.mb-2 { margin-bottom: 1rem; }
    .text-center { text-align: center; }
    .w-full { width: 100%; }
    .muted { color: var(--text-muted); font-size: .9rem; }

    @media (max-width: 600px) {
      .page-wrap, .page-wrap--wide { padding: 1.2rem 1rem 3rem; }
      .card { padding: 1.25rem 1.25rem; }
      h1 { font-size: 1.4rem; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>{% block body %}{% endblock %}</body>
</html>
